<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>@adderecc — Instagram</title>
<meta name="description" content="Siga @adderecc no Instagram." />
<style>
  :root {
    --ig-yellow: #f9ce34;
    --ig-orange: #ee2a7b;
    --ig-purple: #6228d7;
    --card-bg: rgba(255, 255, 255, 0.08);
    --card-border: rgba(255, 255, 255, 0.18);
    --text: #ffffff;
    --text-dim: rgba(255, 255, 255, 0.72);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: radial-gradient(circle at 20% 20%, #f9ce34 0%, transparent 45%),
                radial-gradient(circle at 80% 0%, #ee2a7b 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, #6228d7 0%, transparent 55%),
                linear-gradient(135deg, #4f5bd5, #962fbf, #d62976, #fa7e1e, #feda75);
    background-size: 200% 200%;
    animation: gradientShift 16s ease infinite;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: 28px;
    padding: 40px 32px 32px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    animation: floatIn 0.6s ease;
  }

  @keyframes floatIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .avatar-ring {
    width: 112px;
    height: 112px;
    margin: 0 auto 20px;
    border-radius: 50%;
    padding: 4px;
    background: linear-gradient(135deg, var(--ig-yellow), var(--ig-orange), var(--ig-purple));
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #1a1a2e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    font-weight: 700;
    color: #fff;
    border: 3px solid #1a1a2e;
  }

  h1 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 700;
  }

  .handle {
    margin: 0 0 16px;
    font-size: 15px;
    color: var(--text-dim);
  }

  .bio {
    margin: 0 0 28px;
    font-size: 15px;
    line-height: 1.5;
    color: var(--text-dim);
  }

  .cta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 15px 20px;
    border-radius: 16px;
    border: none;
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(90deg, var(--ig-yellow), var(--ig-orange), var(--ig-purple));
    background-size: 200% auto;
    text-decoration: none;
    transition: transform 0.15s ease, background-position 0.4s ease, box-shadow 0.15s ease;
    box-shadow: 0 8px 24px rgba(238, 42, 123, 0.35);
  }

  .cta:hover {
    background-position: right center;
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(238, 42, 123, 0.45);
  }

  .cta:active {
    transform: translateY(0);
  }

  .cta svg {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }

  .stats {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin: 24px 0 4px;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .stat strong {
    font-size: 16px;
  }

  .stat span {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .divider {
    height: 1px;
    background: var(--card-border);
    margin: 24px 0;
  }

  footer {
    font-size: 12px;
    color: var(--text-dim);
  }

  footer a {
    color: var(--text-dim);
  }
</style>
</head>
<body>
  <main class="card">
    <div class="avatar-ring">
      <div class="avatar">A</div>
    </div>

    <h1>adderecc</h1>
    <p class="handle">@adderecc no Instagram</p>

    <p class="bio">
      Bem-vindo(a)! Siga o perfil para acompanhar novidades, bastidores e conteúdo exclusivo. ✨
    </p>

    <a
      class="cta"
      href="https://www.instagram.com/adderecc/"
      target="_blank"
      rel="noopener noreferrer"
    >
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2c2.717 0 3.056.01 4.122.06 1.065.05 1.79.217 2.428.465a4.9 4.9 0 0 1 1.771 1.153 4.9 4.9 0 0 1 1.153 1.771c.248.637.415 1.363.465 2.428.05 1.066.06 1.405.06 4.122 0 2.717-.01 3.056-.06 4.122-.05 1.065-.217 1.79-.465 2.428a4.9 4.9 0 0 1-1.153 1.771 4.9 4.9 0 0 1-1.771 1.153c-.637.248-1.363.415-2.428.465-1.066.05-1.405.06-4.122.06-2.717 0-3.056-.01-4.122-.06-1.065-.05-1.79-.217-2.428-.465a4.9 4.9 0 0 1-1.771-1.153 4.9 4.9 0 0 1-1.153-1.771c-.248-.637-.415-1.363-.465-2.428C2.01 15.056 2 14.717 2 12c0-2.717.01-3.056.06-4.122.05-1.065.217-1.79.465-2.428A4.9 4.9 0 0 1 3.678 3.68 4.9 4.9 0 0 1 5.45 2.525c.637-.248 1.363-.415 2.428-.465C8.944 2.01 9.283 2 12 2zm0 1.802c-2.67 0-2.987.01-4.04.059-.976.045-1.505.207-1.858.344-.466.181-.8.398-1.15.748-.35.35-.567.684-.748 1.15-.137.353-.3.882-.344 1.857-.05 1.054-.06 1.37-.06 4.04 0 2.67.01 2.987.06 4.04.045.976.207 1.505.344 1.858.181.466.398.8.748 1.15.35.35.684.567 1.15.748.353.137.882.3 1.857.344 1.054.05 1.37.06 4.04.06 2.67 0 2.987-.01 4.04-.06.976-.045 1.505-.207 1.858-.344.466-.181.8-.398 1.15-.748.35-.35.567-.684.748-1.15.137-.353.3-.882.344-1.857.05-1.054.06-1.37.06-4.04 0-2.67-.01-2.987-.06-4.04-.045-.976-.207-1.505-.344-1.858a3.1 3.1 0 0 0-.748-1.15 3.1 3.1 0 0 0-1.15-.748c-.353-.137-.882-.3-1.857-.344-1.054-.05-1.37-.06-4.04-.06z" fill="white"/>
        <path d="M12 6.865a5.135 5.135 0 1 0 0 10.27 5.135 5.135 0 0 0 0-10.27zm0 8.468a3.333 3.333 0 1 1 0-6.666 3.333 3.333 0 0 1 0 6.666z" fill="white"/>
        <circle cx="17.338" cy="6.662" r="1.2" fill="white"/>
      </svg>
      Seguir no Instagram
    </a>

    <div class="stats">
      <div class="stat">
        <strong>@adderecc</strong>
        <span>usuário</span>
      </div>
    </div>

    <div class="divider"></div>

    <footer>
      Feito com ♡ para <a href="https://www.instagram.com/adderecc/" target="_blank" rel="noopener noreferrer">@adderecc</a>
    </footer>
  </main>
</body>
</html>
